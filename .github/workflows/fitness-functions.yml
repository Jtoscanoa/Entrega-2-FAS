# Pipeline de fitness functions (Figura 6). Un build rojo bloquea la fusión
# (configurar "Require status checks to pass" en la protección de la rama main).
name: fitness-functions

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * *"   # 03:00 en Bogotá (UTC-5): job dinámico nocturno
  workflow_dispatch:

jobs:
  estaticas-y-unitarias:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ArchUnit FF-01 a FF-08b, métricas FF-08, JUnit FF-10/12/13/17, JaCoCo FF-10 y PMD FF-09
      - name: mvn verify
        run: mvn -B verify
      # FF-13: un PR con etiqueta "variante" no toca archivos fuera de domain.rules
      - name: Variante sin tocar el núcleo (FF-13)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'variante')
        run: |
          fuera=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '^src/main/' | grep -v '^src/main/java/co/edu/unal/apuntado/domain/rules/' \
            | grep -v '^src/main/resources/META-INF/services/' || true)
          if [ -n "$fuera" ]; then echo "Archivos fuera de domain.rules:"; echo "$fuera"; exit 1; fi
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            target/site/jacoco/
            target/pmd.xml
            target/metricas-acoplamiento.csv
            target/surefire-reports/

  dinamicas-nocturnas:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        run: mvn -B verify
      # FF-14 (latencia p95 < 300 ms) y FF-15 (reconexión <= 5 s) requieren el servidor
      # desplegado en staging; los scripts de k6 se agregan en el E3 (tests/k6/).
      - name: k6 (E3)
        run: |
          if [ -d tests/k6 ]; then echo "Ejecutar k6 contra staging"; else echo "Pendiente E3: tests/k6 aún no existe"; fi
